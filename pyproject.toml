[project]
name = "agent-reach"
version = "2.2.0"
description = "Customer intelligence and lead discovery agent: finds people with the problem you solve in public communities and drafts honest replies in your own voice. CLI, MCP server and one shared skill pack."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Neo Reid"}]
keywords = [
    "ai-agent", "llm-tools", "agent-infrastructure",
    "web-reader", "web-scraper", "search",
    "twitter-scraper", "reddit-scraper", "youtube-transcript",
    "bilibili", "xiaohongshu",
    "ai-search", "cli", "automation",
    "claude-code", "cursor", "openai",
    "free-api", "no-api-key",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "yt-dlp[default]==2026.8.19",
    "mcp>=1.27,<3",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.17.3",
    "mypy>=1.12",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
agent-reach = "agent_reach.cli:main"

[project.urls]
Homepage = "https://github.com/agent-reach/agent-reach"
Repository = "https://github.com/agent-reach/agent-reach"
Issues = "https://github.com/agent-reach/agent-reach/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_reach"]

# The skill pack ships inside the wheel. skillpack.py looks for agent_reach/skillpack.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "agent_reach/skillpack"

[tool.hatch.build.targets.sdist]
include = ["agent_reach", "skills", "scripts", "tests", "docs", "README.md", "AUDIT.md", "CHANGELOG.md", "constraints.txt", "llms.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
