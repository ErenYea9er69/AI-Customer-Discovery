name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version v${version}" >&2
            exit 1
          fi
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          python scripts/validate_skills.py
          python scripts/gen_tool_reference.py --check
          ruff check agent_reach/discovery agent_reach/mcp scripts tests
          mypy agent_reach/discovery agent_reach/mcp
          python -m pytest tests --timeout=120
      - name: Build wheel, sdist and skill pack
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import shutil
          shutil.make_archive("dist/agent-reach-skills", "zip", "skills")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build again for the release files
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import shutil
          shutil.make_archive("dist/agent-reach-skills", "zip", "skills")
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --verify-tag

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: verify
    # Needs trusted publishing set up on PyPI and a repository variable PUBLISH_TO_PYPI=true.
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Build and push to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -t "${image}:${GITHUB_REF_NAME}" -t "${image}:latest" .
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:latest"
